[workspace]
members = [
    "db",
    "backend",
    "event-listener",
    "matching-engine", "pm-cli",
]

resolver = "3"
[workspace.dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "migrate"] }
tokio = { version = "1.48.0", features = ["full"] }
dotenvy = "0.15.7"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
rust_decimal = "1.39.0"
anchor-lang = "0.32.1"
anchor-client = {version = "0.32.1", features= ["async"]}
serde_json = "1.0.145"
anchor-spl = "0.32.1"
solana-client = "2.1.4"
solana-sdk = "2.1.4"
spl-token = "6.0.0"
spl-associated-token-account = "6.0.0"
base64 = "0.22.1"
bincode = "1.3.3"
